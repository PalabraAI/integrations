[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palabra-ai-openai-agents"
version = "0.2.0"
description = "Palabra Realtime STT/TTS models for the OpenAI Agents SDK VoicePipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Palabra.ai", email = "support@palabra.ai" }]
keywords = ["palabra", "openai-agents", "voice", "stt", "tts", "asr", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "palabra-ai>=2.1,<3",
    "openai-agents[voice]>=0.22",
    "numpy>=1.24",
]

[project.optional-dependencies]
examples = ["sounddevice>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "build>=1.2"]

[project.urls]
Homepage = "https://palabra.ai"
Documentation = "https://platform.palabra.ai/docs"
Source = "https://github.com/PalabraAI/integrations"
Issues = "https://github.com/PalabraAI/integrations/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/palabra_openai_agents"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: talks to the real Palabra API (needs PALABRA_API_KEY)"]
