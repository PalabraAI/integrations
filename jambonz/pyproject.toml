[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palabra-ai-jambonz-bridge"
version = "0.1.0"
description = "jambonz custom speech (STT/TTS) vendor backed by Palabra Realtime STT/TTS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Palabra.ai", email = "support@palabra.ai" }]
keywords = ["palabra", "jambonz", "stt", "tts", "asr", "cpaas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "palabra-ai>=2.1,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.8", "build>=1.2"]

[project.scripts]
palabra-jambonz-bridge = "palabra_jambonz.__main__:main"

[project.urls]
Homepage = "https://palabra.ai"
Documentation = "https://platform.palabra.ai/docs"
Source = "https://github.com/PalabraAI/integrations"
Issues = "https://github.com/PalabraAI/integrations/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/palabra_jambonz"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "Dockerfile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: talks to the real Palabra API (needs PALABRA_API_KEY)"]
